version: '3.8'

services:
  label-studio-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "8080:8080"
    volumes:
      - ./label-studio-data:/label-studio/data
    environment:
      - DJANGO_DB=default
      - LABEL_STUDIO_BASE_DATA_DIR=/label-studio/data
    stdin_open: true
    tty: true

# To run: docker-compose -f docker-compose.server.yml up
# To build and run: docker-compose -f docker-compose.server.yml up --build
